version: 1
policy:
  canonical_store: postgresql
  retrieval_store_is_not_source_of_truth: true
  ai_generated_content_is_not_evidence: true
  ecu_writes_forbidden: true
  production_reads_require_status: verified

agents:
  - id: source_scout
    purpose: Find candidate technical sources for a scoped vehicle or subsystem.
    reads: [catalog_scope]
    writes: [knowledge.sources_candidate]
    human_gate: on_license_uncertainty

  - id: license_gate
    purpose: Classify allowed ingestion, indexing, citation, and redistribution.
    reads: [knowledge.sources_candidate]
    writes: [knowledge.sources_status, ops.review_items]
    human_gate: paid_or_unclear_license

  - id: document_extractor
    purpose: Extract text, tables, headings, and precise locators without interpretation.
    reads: [approved_source_binary]
    writes: [knowledge.documents, knowledge.document_chunks]
    human_gate: extraction_quality_below_threshold

  - id: entity_resolver
    purpose: Resolve manufacturer, model, generation, engine, ECU, market, and aliases.
    reads: [catalog, knowledge.document_chunks]
    writes: [catalog.candidates, ops.review_items]
    human_gate: ambiguous_entity_merge

  - id: technical_mapper
    purpose: Produce evidence-linked candidate claims, parameters, DTCs, and procedures.
    reads: [catalog, knowledge.document_chunks]
    writes: [knowledge.claims_candidate, knowledge.claim_evidence]
    output_schema: agents/contracts/technical_claim.schema.json
    human_gate: high_risk_candidate

  - id: formula_validator
    purpose: Validate decoder keys, units, byte lengths, ranges, and test vectors.
    reads: [catalog.parameter_candidates, knowledge.claim_evidence]
    writes: [validation_results, ops.review_items]
    code_execution: fixed_decoders_only
    human_gate: manufacturer_enhanced_parameter

  - id: conflict_verifier
    purpose: Corroborate claims and detect source, market, year, ECU, or version conflicts.
    reads: [knowledge, catalog]
    writes: [knowledge.claim_status, ops.review_items]
    human_gate: credible_conflict

  - id: publisher
    purpose: Atomically publish only data that passed policy gates.
    reads: [approved_change_set]
    writes: [catalog.published, knowledge.verified]
    llm_decision: false
    human_gate: already_satisfied

  - id: runtime_planner
    purpose: Select the smallest safe read-only PID set for a symptom.
    reads: [catalog.published, knowledge.verified]
    writes: [runtime.plan]
    output_schema: agents/contracts/diagnostic_plan.schema.json
    tools: [resolve_vehicle, list_supported_parameters, get_verified_claims]

  - id: diagnostic_analyst
    purpose: Analyze a completed OBD session using deterministic facts and verified knowledge.
    reads: [runtime.single_session, catalog.published, knowledge.verified]
    writes: [runtime.ai_report_candidate]
    output_schema: agents/contracts/diagnosis.schema.json
    tools: [get_session_summary, get_verified_claims, search_technical_documents]

  - id: safety_auditor
    purpose: Block unsafe, unsupported, or uncited user-facing conclusions.
    reads: [runtime.ai_report_candidate, evidence]
    writes: [runtime.ai_report_approved, ops.review_items]
    human_gate: safety_critical_or_uncertain
